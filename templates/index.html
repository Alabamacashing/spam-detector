<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spam Detector</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f0f1a;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: #1a1a2e;
            border-radius: 20px;
            padding: 40px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        h1 {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #f97316, #ef4444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }
        textarea {
            width: 100%;
            height: 150px;
            background: #0f0f1a;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 16px;
            color: white;
            font-size: 1rem;
            resize: none;
            outline: none;
            transition: border-color 0.3s;
        }
        textarea:focus { border-color: #f97316; }
        textarea::placeholder { color: #555; }
        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #f97316, #ef4444);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 16px;
            transition: opacity 0.3s;
        }
        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .result {
            margin-top: 24px;
            padding: 24px;
            background: #0f0f1a;
            border-radius: 12px;
            text-align: center;
            display: none;
        }
        .emoji { font-size: 3rem; margin-bottom: 8px; }
        .label { font-size: 1.8rem; font-weight: bold; margin-bottom: 8px; }
        .spam { color: #ef4444; }
        .legitimate { color: #4ade80; }
        .confidence { color: #888; font-size: 0.95rem; }
        .examples {
            margin-top: 24px;
            border-top: 1px solid #333;
            padding-top: 20px;
        }
        .examples p {
            color: #888;
            font-size: 0.85rem;
            margin-bottom: 10px;
        }
        .example-btn {
            background: #1a1a2e;
            border: 1px solid #333;
            border-radius: 8px;
            color: #aaa;
            padding: 8px 12px;
            font-size: 0.8rem;
            cursor: pointer;
            margin: 4px;
            width: auto;
            transition: border-color 0.3s;
        }
        .example-btn:hover {
            border-color: #f97316;
            color: white;
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚨 Spam Detector</h1>
        <p class="subtitle">Paste any email or text message to check if it's spam</p>

        <textarea 
            id="message" 
            placeholder="e.g. Congratulations! You have won a free iPhone. Click here to claim your prize now!"
        ></textarea>

        <button onclick="checkSpam()" id="btn">Check Message</button>

        <div class="result" id="result">
            <div class="emoji" id="emoji"></div>
            <div class="label" id="label"></div>
            <div class="confidence" id="confidence"></div>
        </div>

        <div class="examples">
            <p>Try these examples:</p>
            <button class="example-btn" onclick="fillExample('WINNER!! You have been selected to receive a $1000 gift card. Call now 08071230234')">Spam example</button>
            <button class="example-btn" onclick="fillExample('Hey, are we still meeting for lunch tomorrow at 1pm?')">Legitimate example</button>
            <button class="example-btn" onclick="fillExample('FREE entry! Text WIN to 87121 to claim your prize. T&C apply.')">SMS spam example</button>
        </div>
    </div>

    <script>
        function fillExample(text) {
            document.getElementById("message").value = text;
        }

        async function checkSpam() {
            const message = document.getElementById("message").value;
            if (!message.trim()) {
                alert("Please enter a message!");
                return;
            }

            const btn = document.getElementById("btn");
            const result = document.getElementById("result");

            btn.disabled = true;
            btn.textContent = "Checking...";
            result.style.display = "none";

            try {
                const response = await fetch("/check", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message })
                });

                const data = await response.json();

                document.getElementById("emoji").textContent = data.emoji;
                document.getElementById("label").textContent = data.label;
                document.getElementById("label").className =
                    "label " + data.label.toLowerCase();
                document.getElementById("confidence").textContent =
                    `Confidence: ${data.confidence}%`;

                result.style.display = "block";
            } catch (err) {
                alert("Something went wrong. Please try again.");
            } finally {
                btn.disabled = false;
                btn.textContent = "Check Message";
            }
        }

        document.getElementById("message").addEventListener("keydown", function(e) {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                checkSpam();
            }
        });
    </script>
</body>
</html>
